[package]
name = "aegis"
version = "0.1.0"
description = "Aegis - local desktop AI harness"
authors = ["Pierre Yager"]
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# The library carries the whole runtime; `main.rs` is a thin entry point.
# The `staticlib`/`cdylib` crate types keep the door open for a mobile
# target later without another restructure.
[lib]
name = "aegis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
