[package]
name = "aegis"
version = "0.1.0"
description = "Aegis - local desktop AI harness"
authors = ["Pierre Yager"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

# The library carries the whole runtime; `main.rs` is a thin entry point.
# The `staticlib`/`cdylib` crate types keep the door open for a mobile
# target later without another restructure.
[lib]
name = "aegis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Two Tauri features, and both are here so the WebView ends up with less
# rather than more. `tray-icon` keeps the tray in Rust, so the window never
# needs window or process permissions. `protocol-asset` registers the `asset:`
# scheme, which is how a captured PNG reaches an `<img>` without its bytes
# crossing the IPC channel as base64 (PLAN 5.4); the scheme is scoped at
# runtime to the capture directory alone, in `lib.rs`.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
# The folder picker is driven from Rust (PLAN 2.1). The plugin is registered
# on the builder but deliberately granted to no window: `capabilities/main.json`
# carries no `dialog:` permission, so the WebView cannot open a dialog itself.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Persistence support. `chrono` and `uuid` give RFC3339 stamps and v4 ids for
# the project records; `dunce` canonicalizes without leaving Windows verbatim
# (`\\?\C:\...`) prefixes in a path the user is meant to read. `tokio` is
# already in the tree via Tauri — only the `sync` feature is pulled in, for the
# oneshot channel that awaits the native dialog callback.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
dunce = "1"
# `tokio` is already in the tree via Tauri. Phase 5 widens the feature set the
# turn loop needs: `rt` and `macros` for `select!` and for the runtime the
# tests spin up, `time` for the delta-coalescing window and the fake provider's
# pacing. Phase 7 adds `process` and `io-util`, which are what let `shell_exec`
# stream a child's pipes while staying inside the same `select!` as the turn's
# cancel token — a blocking `wait()` would make a running command unstoppable.
# `tokio-util` is here for `CancellationToken` alone — one token per turn, held
# by the session registry and awaited by the loop (PLAN 4.2).
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
# The audit log digests a tool call's arguments so two calls can be compared
# without either line quoting what they carried. Phase 9 hashes captured PNGs
# with the same crate.
sha2 = "0.10"
# Screen capture (PLAN 5.1-5.3). One crate covering Windows (GDI/DXGI), macOS
# (CoreGraphics) and Linux (xcb on X11, libwayshot on wlroots), rather than a
# Tauri plugin: a plugin has to be granted to the window in
# `capabilities/main.json`, and every privileged operation in Aegis is a
# policy-gated Rust command instead. `xcap` re-exports the `image` crate it
# decodes into, so writing a PNG needs no second dependency and no second
# version of that one. It is why `rust-version` is 1.85: `xcap` is edition
# 2024. The Linux build wants `libxcb`, `libxrandr`, `libpipewire-0.3`,
# `libwayland`, `libegl`, `libgbm` and `libdrm` dev packages plus `clang` on
# top of the WebKitGTK ones; see the README. `pkg-config` can succeed and
# linking still fail if GBM/EGL/Wayland are missing (`-lgbm`).
xcap = "0.9"
# The real provider speaks HTTP to an OpenAI-compatible endpoint (PLAN 4.1).
# `reqwest` is already in the tree via Tauri, but with no TLS backend at all —
# choosing one is this line's whole job. `native-tls` uses what the machine
# already trusts (schannel on Windows, Security.framework on macOS, OpenSSL on
# Linux), so a corporate proxy's own certificate works without Aegis being
# taught about it, and a `cargo build` needs no C toolchain on Windows. The
# response is consumed with `chunk()`, which is not behind a feature flag, so
# the SSE loop needs no stream adapters.
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "json",
    "system-proxy",
] }
# Claude Code OAuth (`sk-ant-oat01-*` + identity headers), the ChatGPT
# Codex Responses backend, and Gemini's Generative Language API are not
# OpenAI-compatible chat/completions. The crate speaks those dialects; Aegis
# still owns reading `~/.claude`, `~/.codex` and `~/.grok` and still maps the
# stream onto `ModelEvent`. CLI backends (`claude-code`, `codex-cli`,
# `gemini-cli`) are deliberately off: those shell out to a second agent.
motosan-ai = { version = "0.27.1", default-features = false, features = [
    "anthropic",
    "chatgpt-codex",
    "gemini",
] }
# `motosan-ai::Client::stream` is a futures `Stream`. The turn loop consumes
# it with `select!` the same way it consumes the OpenAI SSE channel.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# JWT `exp` / `chatgpt_account_id` claims in a Codex access token, so a
# refresh can happen before the first 401.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# `src/ipc/bindings.ts` is generated from the payload structs rather than
# written twice (PLAN 1, "Notes on structure"). The export itself runs as a
# `cargo test`, so nothing generates during a release build; the `TS` impls are
# all that reach the binary. See `.cargo/config.toml` for where the file lands.
ts-rs = "12"

# Console programs on Windows do not write UTF-8. `cmd`, `dir`, `ver` and most
# of the built-in tooling emit the system OEM code page (437, 850, 932 …), so
# `shell_exec` needs `MultiByteToWideChar` to turn that back into text. This is
# the only Windows API the runtime calls directly; everything else goes through
# Tauri. The version is the one already in the tree via Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
# Credential Manager. See the note above the macOS entry for why each platform
# names its own backend.
keyring = { version = "3.6", features = ["windows-native"] }

# The API key lives in the OS credential store, never in a file Aegis writes
# and never in the WebView (AGENTS.md). Each platform names its own backend
# rather than one feature set covering all three, because they are not
# equivalent: the Linux backend talks to a Secret Service over D-Bus and wants
# `libdbus-1-dev` at build time and a running keyring daemon at run time, and
# that is not a cost a Windows or macOS build should inherit. `crypto-rust`
# keeps the Linux path off OpenSSL. Version 3 rather than 4: 4 raises the
# minimum toolchain past this crate's `rust-version`.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
# `test-util` gives the tests a pausable clock. The approval gate has a
# five-minute deadline (PLAN 4.2); proving that it fires should not cost five
# minutes of wall time, and a shorter constant compiled in for tests would be
# proving something other than what ships.
# `net` is for the loopback server `tests/wire.rs` streams SSE from: the
# provider is proved against real sockets and a real HTTP response rather than
# against a hand-fed byte slice, which is the half of it that could otherwise
# be wrong in a way no unit test would notice.
tokio = { version = "1", features = ["test-util", "net"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
